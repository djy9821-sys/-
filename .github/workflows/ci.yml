name: CI

# 每次推送和 PR 自动跑代码检查、单元测试与构建，失败会在 GitHub 上标红。
# e2e job 另起一台机器：构建后用 Playwright 在 Chromium 里走一遍主流程（见 e2e/ 与 playwright.config.js）。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright 只在 CI 里用，不进 package.json / lock（本地安装依赖时不必下载浏览器）。
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@^1.50.0
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
